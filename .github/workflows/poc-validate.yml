name: TinkerTunnel POC contract
on:
  push:
    branches: [main, 'poc/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    # Persistent self-hosted runners must not execute untrusted fork PR code.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, ci, linux-x64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test portal account provisioning and MCP
        run: npm test
      - uses: actions/setup-go@v5
        with:
          go-version-file: host/go.mod
          cache: false
      - name: Test distributed Host Service
        run: cd host && go test ./...
      - name: Cross-compile Linux ARM64 Host Service
        run: cd host && GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /tmp/tinkertunnel-host-linux-arm64 .
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate artifact packaging
        run: python -m unittest discover -s poc -p 'test_*.py' -v
      - name: Exercise artifact publishing contract
        shell: bash
        run: |
          mkdir -p out
          printf 'tinkertunnel-poc-only-NOT-FLASHABLE' > demo.bin
          python poc/artifacts.py --source demo.bin --output out --commit "${GITHUB_SHA}"
      - uses: actions/upload-artifact@v4
        with:
          name: tinkertunnel-poc-contract-${{ github.sha }}
          path: out/
          if-no-files-found: error
