name: Main{Create} platform validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feature/**']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version-file: host/go.mod
      - name: Syntax checks
        run: |
          node --check runner/agent.mjs
          node --check runner/marketplace_toolkits.mjs
          node --check controller/marketplace_planning.mjs
          node --check controller/fabric.mjs
          node --check controller/routes.mjs
      - name: Controller, portal and runner tests
        run: npm test
      - name: Host service tests
        run: (cd host && go test ./...)
      - name: Documentation contract
        run: npm run docs:check
