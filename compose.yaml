# Main{Create}: deployment entry point at the repository ROOT.
# Default services: management portal/controller + authenticated read-only MCP gateway.
# Optional profiles: tunnel and runner. No device, Docker socket or host access.
services:
  portal:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      MAIN_DATA_DIR: /data
      MAIN_REQUIRE_LOGIN: "1"
      # Must be explicitly enabled by the operator AFTER reviewing the trust model.
      MAIN_ENABLE_FABRIC_EXECUTION: ${MAIN_ENABLE_FABRIC_EXECUTION:-0}
      # Browser-created account credentials are persisted under /data.
      MAIN_MASTER_KEY: ${MAIN_MASTER_KEY:-}
      MAIN_GITHUB_CLIENT_ID: ${MAIN_GITHUB_CLIENT_ID:-}
      MAIN_SERVICE_TOKEN: ${MAIN_SERVICE_TOKEN:-}
      MAIN_MCP_TOKEN: ${MAIN_MCP_TOKEN:-}
    expose:
      - "3000"
    ports:
      - "127.0.0.1:${PORTAL_PORT:-13000}:3000"
    volumes:
      - main_data:/data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      portal:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3001"
      MAIN_CONTROLLER_URL: http://portal:3000
      MAIN_SERVICE_TOKEN: ${MAIN_SERVICE_TOKEN:-}
      MAIN_MCP_TOKEN: ${MAIN_MCP_TOKEN:-}
      MAIN_MCP_ALLOWED_ORIGINS: ${MAIN_MCP_ALLOWED_ORIGINS:-}
    expose:
      - "3001"
    ports:
      - "127.0.0.1:${MAIN_MCP_PORT:-13001}:3001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 128m
    cpus: 0.5
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:3001/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  tunnel:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      TUNNEL_TOKEN: ${MAIN_TUNNEL_TOKEN:-}
    command: ["tunnel","--no-autoupdate","run"]
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  # OpenAI Secure MCP Tunnel: the only external connection is outbound HTTPS to OpenAI.
  # Never publish port 3001 or any tunnel-client health/admin port.
  # This is a separate tunnel identity from other MCP/Agentic deployments.
  openai-tunnel:
    profiles: ["openai-tunnel"]
    image: ghcr.io/openai/tunnel-client:v0.0.19
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      CONTROL_PLANE_TUNNEL_ID: ${MAIN_OPENAI_TUNNEL_ID:-}
      CONTROL_PLANE_API_KEY: file:/run/secrets/openai_runtime_api_key
      MCP_SERVER_URL: http://gateway:3001/mcp
      MCP_EXTRA_HEADERS: "Authorization: file:/run/secrets/main_mcp_auth_header"
      MCP_DISCOVERY_EXTRA_HEADERS: "Authorization: file:/run/secrets/main_mcp_auth_header"
      LOG_LEVEL: info
      LOG_FORMAT: json
      HEALTH_LISTEN_ADDR: 127.0.0.1:8080
    secrets:
      - openai_runtime_api_key
      - main_mcp_auth_header
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.25

  runner:
    profiles: ["runner"]
    build:
      context: ./runner
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      portal:
        condition: service_healthy
    environment:
      MAIN_CONTROLLER_URL: http://portal:3000
      MAIN_RUNNER_STATE_DIR: /var/lib/maincreate
    volumes:
      - main_runner:/var/lib/maincreate
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 128m

volumes:
  main_data:
  main_runner:

# Secrets are intentionally supplied as local, untracked files. The OpenAI API key
# and the MCP bearer header must never be committed or pasted into the web UI.
secrets:
  openai_runtime_api_key:
    file: ${MAIN_OPENAI_API_KEY_FILE:-./secrets/openai-runtime-api-key}
  main_mcp_auth_header:
    file: ${MAIN_MCP_AUTH_HEADER_FILE:-./secrets/main-mcp-auth-header}
