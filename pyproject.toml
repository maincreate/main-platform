[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tinkertunnel"
version = "0.1.0"
description = "TinkerTunnel curated marketplace and execution fabric preview"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]

[tool.setuptools.packages.find]
include = ["tinkertunnel*"]
